[package]
name = "email-validator-smtp"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
description = "Verificación real de entregabilidad SMTP mediante RCPT TO"

[dependencies]
# Workspace dependencies
shared = { path = "../shared" }
tokio = { workspace = true, features = ["full"] }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
hickory-resolver = { workspace = true }

# SMTP/TLS
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["logging"] }
rustls-pemfile = "1.0"
webpki-roots = "0.26"

# Utilities
rand = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"