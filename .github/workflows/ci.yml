name: CI / Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker compose build

      - name: Start Service
        run: |
          docker compose up -d
          sleep 5

      - name: Test Health Check
        run: |
          curl --fail http://localhost:3000/health

      - name: Test Email Validation Endpoint
        run: |
          curl --fail -X POST http://localhost:3000/api/v1/validate-email \
            -H "Content-Type: application/json" \
            -H "X-API-Key: your-super-secret-api-key-change-me-in-production" \
            -d '{"email":"test@gmail.com"}'
