[workspace]
members = [
    "packages/shared",
    "packages/validation",
    "packages/dns",
    "packages/api",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["DarzKrow"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
base64 = "0.21"
sha2 = "0.10"